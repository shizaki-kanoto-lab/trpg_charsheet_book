name: 通過記録をNotionに作る

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Notionに書き込む（オフなら追加予定の一覧だけ出す）"
        type: boolean
        default: false
      prune_emoklore:
        description: "エモクロアのシートからなくなった行をゴミ箱へ移す"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: シート帳と卓報告から通過記録を作る
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: node tools/sync-runs.js ${{ inputs.write && '--write' || '' }} ${{ inputs.prune_emoklore && '--prune-emoklore' || '' }}
