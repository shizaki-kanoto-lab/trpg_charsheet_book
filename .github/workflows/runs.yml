name: 通過記録をNotionに作る

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Notionに書き込む（オフなら追加予定の一覧だけ出す）"
        type: boolean
        default: false
      only:
        description: "このキャラ名を含むシートの行だけ追加する（空なら全員）"
        type: string
        default: ""
      pl:
        description: "PL人数が空の行に、卓報告のPL欄から人数を入れる（書き込みはwriteもオン）"
        type: boolean
        default: false
      prune:
        description: "いあきゃら・キャラッシュ・エモクロアのシートからなくなった行をゴミ箱へ移す"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: シート帳と卓報告から通過記録を作る
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          ONLY: ${{ inputs.only }}
        run: node tools/sync-runs.js ${{ inputs.write && '--write' || '' }} ${{ inputs.prune && '--prune' || '' }} ${{ inputs.pl && '--pl --pl-list' || '' }} "--only=$ONLY"
