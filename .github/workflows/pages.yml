name: シート帳をGitHub Pagesに公開

on:
  schedule:
    - cron: "17 */3 * * *"   # 3時間ごと
  workflow_dispatch:
    inputs:
      fresh:
        description: "前回の本文を使い回さず、全ページの本文（メモ・チャットパレット）を読み直す"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "tools/build-site.js", "extension/notion.js", "extension/gsheet.js", "extension/runs.js", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Notionから書き出す
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: node tools/build-site.js ${{ inputs.fresh != true && format('--previous "{0}/data.json"', steps.pages.outputs.base_url) || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
