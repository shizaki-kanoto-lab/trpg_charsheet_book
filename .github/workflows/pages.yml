name: シート帳をGitHub Pagesに公開

on:
  schedule:
    - cron: "17 */3 * * *"   # 3時間ごと
  workflow_dispatch:
    inputs:
      fresh:
        description: "前回の本文を使い回さず、全ページの本文（メモ・チャットパレット）を読み直す"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "tools/build-site.js", "extension/notion.js", "extension/gsheet.js", "extension/runs.js", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Notionから書き出す
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: node tools/build-site.js ${{ inputs.fresh != true && format('--previous "{0}/data.json"', steps.pages.outputs.base_url) || '' }}
      # The copied pictures (ケダモノオペラ, ほうかご探報, Google Sheets) can be several MB; the gallery shows
      # them at most ~600px wide, so they are cut down to 1200px on the long side.
      - name: 立ち絵を軽くする
        run: |
          shopt -s nullglob
          files=(site/img/*)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          npm install --no-save --no-package-lock --silent sharp@0.33.5
          node -e '
            const sharp = require("sharp"), fs = require("fs");
            (async () => {
              let before = 0, after = 0;
              for (const f of process.argv.slice(1)) {
                const buf = fs.readFileSync(f); before += buf.length;
                try {
                  const img = sharp(buf, { animated: true }), m = await img.metadata();
                  if (Math.max(m.width || 0, m.pageHeight || m.height || 0) > 1200 || buf.length > 400000) {
                    let out = img.resize(1200, 1200, { fit: "inside", withoutEnlargement: true });
                    out = m.format === "png" ? out.png({ compressionLevel: 9, palette: buf.length > 400000 }) : out;
                    const small = await out.toBuffer();
                    if (small.length < buf.length) { fs.writeFileSync(f, small); after += small.length; continue; }
                  }
                } catch (e) { console.log(`縮められませんでした: ${f} (${e.message})`); }
                after += buf.length;
              }
              console.log(`立ち絵 ${process.argv.length - 1}枚: ${Math.round(before / 1024)}KB → ${Math.round(after / 1024)}KB`);
            })();' "${files[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
