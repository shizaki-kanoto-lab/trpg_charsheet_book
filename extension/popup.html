<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シート帳へ送る</title>
<style>
  :root{--bg:#FFFDF7;--fg:#1B2928;--muted:#4F5C5A;--line:#D8CFBF;--accent:#244B4A;--ok:#2E7D4F;--warn:#9A5B00;--soft:#F5F0E6}
  @media (prefers-color-scheme:dark){:root{--bg:#172120;--fg:#ECE7DC;--muted:#AEB9B5;--line:#2C3A38;--accent:#2F524F;--ok:#6CC08F;--warn:#E5B567;--soft:#1F2B2A;color-scheme:dark}}
  body{margin:0;width:340px;background:var(--bg);color:var(--fg);font:13px/1.6 "Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif}
  main{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  h1{font-size:14px;margin:0}
  .site{color:var(--muted);font-size:12px;word-break:break-all}
  label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
  input,select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--soft);color:inherit;font:inherit}
  .st{border-radius:6px;padding:8px 10px;background:var(--soft);font-size:12px}
  .st.ok{border-left:3px solid var(--ok)} .st.warn{border-left:3px solid var(--warn)}
  button{font:inherit;border-radius:6px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:inherit}
  button.primary{background:var(--accent);border-color:var(--accent);color:#F7F3EA;font-weight:700}
  button:disabled{opacity:.5;cursor:not-allowed}
  .wide{width:100%}
  details{font-size:12px;color:var(--muted)}
  .msg{font-size:12px;color:var(--ok);min-height:1em;white-space:pre-wrap}
  .msg.err{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>シート帳へ送る</h1>
  <div class="site" id="site">読み込み中…</div>
  <div class="st" id="status">読み込み中…</div>
  <section id="single" hidden>
    <div id="pickBox" hidden style="margin-bottom:8px"><label for="pick">追加するキャラ</label><select id="pick"></select></div>
    <div><label for="name">キャラクター名</label><input id="name"></div>
    <button class="primary wide" id="send" type="button" style="margin-top:8px">このシートをシート帳に送る</button>
  </section>
  <section id="allBox" hidden>
    <button class="primary wide" id="sendAll" type="button">全員をシート帳に送る</button>
  </section>
  <div class="msg" id="msg"></div>
  <button class="wide" id="open" type="button">Notionのシート帳を開く</button>
  <details id="settings">
    <summary>設定</summary>
    <p><label for="token">Notionのトークン</label><input id="token" type="password" autocomplete="off"></p>
    <p><label for="db">データベースのURL</label><input id="db" type="url"></p>
    <button id="save" type="button">保存</button>
  </details>
</main>
<script src="notion.js"></script>
<script src="runs.js"></script>
<script src="iachara.js"></script>
<script src="charash.js"></script>
<script src="vinsanet.js"></script>
<script src="ytsheet.js"></script>
<script src="vampire.js"></script>
<script src="appspot.js"></script>
<script src="gsheet.js"></script>
<script src="popup.js"></script>
</body>
</html>
