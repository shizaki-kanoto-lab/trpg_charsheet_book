<title>キャラクターシート帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an index-card rack on the left, the open sheet on the right; stat boxes read like a printed TRPG sheet. */
:root{
  --bg:#E8EBF0; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#161B26; --muted:#4A5264; --line:#D2D7E0;
  --accent:#3346B8; --accent-ink:#FFFFFF; --accent-soft:#E2E6F9;
  --hp:#C2413A; --mp:#2F70BC; --san:#7A4DB3; --danger:#B3261E;
  --f-display:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131A; --surface:#191D27; --surface-2:#212633; --ink:#E5E8EF; --muted:#B0B7C6; --line:#2D3343;
  --accent:#8F9EFF; --accent-ink:#0D1120; --accent-soft:#242B48;
  --hp:#EA6C63; --mp:#6EA6EC; --san:#B08AE6; --danger:#F07A72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131A; --surface:#191D27; --surface-2:#212633; --ink:#E5E8EF; --muted:#B0B7C6; --line:#2D3343;
  --accent:#8F9EFF; --accent-ink:#0D1120; --accent-soft:#242B48;
  --hp:#EA6C63; --mp:#6EA6EC; --san:#B08AE6; --danger:#F07A72; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
html{font-size:112.5%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.86rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}

.app{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:calc(100% - 64px)}
.rack{border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;min-width:0}
.rack-tools{display:flex;flex-direction:column;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px 16px}
.search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.86rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{list-style:none;margin:0;padding:4px 10px 20px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;
  padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent}
.card:hover{background:var(--surface)}
.card[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.card .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:44px;height:44px;border-radius:6px;object-fit:cover;display:grid;place-items:center;
  font-family:var(--f-display);font-size:1.1rem;color:#fff}
.hits{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.hits span{font-size:.86rem;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px;white-space:nowrap}
.hits b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 4px;font-size:.86rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.seg small{font-family:var(--f-mono);margin-left:3px;opacity:.8}
.lostmark{font-size:.86rem;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.card.is-lost .avatar{filter:grayscale(1);opacity:.55}
.card.is-lost .nm{color:var(--muted)}
.portrait.is-lost{filter:grayscale(1);opacity:.6}
.cnt{font-size:.7rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.grp{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted);cursor:pointer}
.sheets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sheets .lbl{font-size:.86rem;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-right:4px}
.sheets button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:.86rem;text-align:left;line-height:1.35}
.sheets button small{display:block;color:var(--muted);font-size:.7rem}
.sheets button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.search-help{font-size:.86rem;color:var(--muted);margin:-4px 0 0}
.rack-empty{padding:24px 16px;color:var(--muted);font-size:.9rem}

.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.back{display:none}

.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start}
.portrait{width:150px;aspect-ratio:3/4;max-width:100%;border-radius:8px;object-fit:cover;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-display);font-size:3rem;color:#fff}
.ruby{color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.name{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.2;margin:2px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.88rem;color:var(--muted);align-items:center}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 8px;font-weight:700;font-size:.86rem}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.86rem}
.summary{margin:12px 0 0;max-width:60ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.sec h2{font-size:.86rem;letter-spacing:.14em;color:var(--muted);margin:0 0 10px;font-weight:700;
  display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}

.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.resrow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.resrow .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.resrow .lb{font-weight:700;font-size:.85rem}
.resrow .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem}
.resrow .num small{color:var(--muted);font-size:.86rem}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));transition:width .2s}
.step{display:flex;gap:4px}
.step button{width:28px;height:26px;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;font-family:var(--f-mono);line-height:1}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stat{border:2px solid var(--ink);border-radius:6px;padding:6px 8px 8px;text-align:center;background:var(--surface)}
.stat .lb{font-size:.86rem;letter-spacing:.1em;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}

.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 28px;margin:0;padding:0;list-style:none}
.skills li{display:flex;align-items:baseline;gap:6px;padding:4px 0}
.skills li .l{min-width:0;overflow-wrap:anywhere}
.skills li .d{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.skills li .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}

.items{margin:0;padding-left:1.2em}
.notes{white-space:pre-wrap;max-width:70ch;margin:0;overflow-wrap:anywhere}
.none{color:var(--muted);font-size:.9rem}
.stamp{color:var(--muted);font-size:.86rem}

.empty{max-width:520px;margin:10vh auto 0;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--f-display);font-weight:700;color:var(--ink);margin:0;font-size:1.4rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:6px;font-size:.9rem;z-index:20}

.src{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:.85rem;text-decoration:none}
.src:hover{text-decoration:underline}
.palette{font-family:var(--f-mono);font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;
  white-space:pre;overflow:auto;max-height:240px}
.imp{max-width:880px;margin:0 auto 24px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.imp h2{margin:0;font-size:1rem}
.imp textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px 10px;font-family:var(--f-mono);font-size:.86rem}
.imp .pv{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 6px 6px 0;font-size:.9rem}
.imp .err{color:var(--danger);font-size:.88rem}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rack{border-right:0}
  .app.detail .rack{display:none}
  .app:not(.detail) .main{display:none}
  .back{display:inline-flex;align-self:flex-start}
  .hero{grid-template-columns:96px minmax(0,1fr);gap:14px}
  .portrait{width:96px;font-size:2rem}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}a.btn{text-decoration:none;color:inherit}
.hdr-actions{align-items:center}
.banner{max-width:880px;margin:0 auto 20px;border:1px solid var(--line);border-left:3px solid var(--danger);background:var(--surface);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner p{margin:0}
.fresh{font-size:.8rem;color:var(--muted)}
.loading{color:var(--muted);font-size:.9rem}
</style>

<header class="top">
  <div class="brand"><h1>キャラクターシート帳</h1><span id="count"></span></div>
  <div class="hdr-actions">
    <span class="fresh" id="fresh"></span>
    <button class="btn" id="reload" type="button">Notionから再読み込み</button>
    <a class="btn" href="https://www.notion.so/b47dc79665f54fdeb8df5e2afdb134a5" target="_blank" rel="noopener">Notionで開く ↗</a>
  </div>
</header>
<div class="app" id="app">
  <aside class="rack">
    <div class="rack-tools">
      <input class="search" id="search" type="search" placeholder="名前・タグ・技能名で検索" aria-label="キャラクターを検索">
      <p class="search-help">例：<code>目星</code>　<code>目星70</code>（70以上）　<code>図書館&gt;=60 6版</code></p>
      <div class="seg" id="lostSeg" role="group" aria-label="ロストで絞り込む">
        <button type="button" data-lost="alive">生存</button><button type="button" data-lost="lost">ロスト</button><button type="button" data-lost="all">すべて</button>
      </div>
      <label class="grp"><input type="checkbox" id="groupToggle" checked> 同じ名前を1人にまとめる</label>
      <div class="chips" id="chips"></div>
    </div>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="main"><div id="banner"></div><div id="main"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Read-only view of the Notion database "キャラクターシート帳".
   On GitHub Pages it reads data.json, written from Notion by tools/build-site.js.
   As a claude.ai artifact it reads Notion through the viewer's Notion connector. */
const NOTION = "Notion";
const VIEW_URL = "https://www.notion.so/b47dc79665f54fdeb8df5e2afdb134a5?v=37bce5bab279453f93284a7352f68bba";
const RES_COLOR = {HP:"var(--hp)",MP:"var(--mp)",SAN:"var(--san)"};
const CACHE = {staleTime: 10*60*1000, gcTime: 7*24*60*60*1000};

const S = {chars:[], sel:null, q:"", sys:"", lost:"alive", group:true, ready:false, loading:false, error:null, mcp:null, details:{}, static:false};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const store = {get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }};

function hue(str){ let h=0; for (const c of String(str)) h=(h*31+c.codePointAt(0))%360; return h; }
function avatarHTML(c, cls){
  const ch = [...(c.name||"？")][0];
  return `<div class="${cls}" style="background:hsl(${hue(c.name||"")} 42% 42%)" aria-hidden="true">${esc(ch)}</div>`;
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2200); }
function current(){ return S.chars.find(c=>c.id===S.sel); }
function fmtDate(ms){ if(!ms) return ""; const d=new Date(ms); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
const safeUrl = u => /^https?:\/\//.test(String(u||""));
const plain = s => String(s ?? "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();

/* ---------- Notion rows -> characters ---------- */
function toChar(row){
  let tags = [];
  try { tags = JSON.parse(row["タグ"] || "[]"); } catch {}
  if (row["状態"] === "ロスト") tags.push("ロスト");
  const resources = ["HP","MP","SAN"].filter(k => row[k] != null || row[k+"最大"] != null)
    .map(k => ({label:k, cur:num(row[k]), max:num(row[k+"最大"])}));
  const split = s => plain(s).split(" / ").filter(Boolean);
  return {
    id: row.url, name: plain(row["名前"]), ruby: plain(row["ふりがな"]), system: row["システム"] || "", sourceSite: row["サイト"] || "",
    sourceUrl: row["元シート"] || "", summary: plain(row["概要"]), tags: tags.map(String), resources,
    stats: split(row["能力値"]).map(s => { const m = s.match(/^(.*\S)\s+(-?\d+)$/); return m ? {label:m[1], value:m[2]} : {label:s, value:""}; }),
    skills: split(row["技能"]).map(s => { const m = s.match(/^(.*?)(-?\d+)$/); return m ? {label:m[1], value:m[2]} : {label:s, value:""}; }),
    updatedAt: Date.parse(row["最終更新"]) || 0,
  };
}

/* ---------- connector errors ---------- */
const ERRORS = {
  needs_reauth: "Notionの接続が切れています。claude.ai の「設定 → コネクタ」でNotionを再接続してから、再読み込みしてください。",
  server_not_connected: "Notionのコネクタがありません。claude.ai の「設定 → コネクタ」でNotionを追加してから、再読み込みしてください。",
  selection_required: "Notionのコネクタが複数あります。表示された画面で使うものを選んでから、再読み込みしてください。",
  not_in_manifest: "このページにNotionの読み取りが許可されていません。下のボタンから許可してください。",
  approval_required: "Notionを読むには許可が必要です。下のボタンから許可してください。",
  consent_required: "Notionを読むには許可が必要です。下のボタンから許可してください。",
  blocked_by_policy: "組織の設定で、このページからNotionを読むことが禁止されています。",
  not_granted: "このビューではNotionを読めません。claude.ai でこのページを開いてください。",
  capability_disabled: "このビューではNotionを読めません。claude.ai でこのページを開いてください。",
  capability_removed: "このビューではNotionを読めません。claude.ai でこのページを開いてください。",
  server_unavailable: "Notionが応答しません。少し待ってから再読み込みしてください。",
  tool_error: "Notionがエラーを返しました。",
};
const ASKABLE = new Set(["not_in_manifest","approval_required","consent_required"]);
function renderBanner(){
  const e = S.error;
  if (!e){ $("banner").innerHTML = ""; return; }
  $("banner").innerHTML = `<div class="banner" role="alert"><p>${esc(ERRORS[e.code] || "Notionから読み込めませんでした。少し待ってから再読み込みしてください。")}</p>
    ${e.code==="tool_error" && e.message ? `<p class="stamp">${esc(e.message)}</p>` : ""}
    ${ASKABLE.has(e.code) ? `<div><button class="btn primary sm" type="button" id="allow">Notionの読み取りを許可して読み込む</button></div>` : ""}</div>`;
}

/* ---------- loading ---------- */
async function call(tool, input, refresh){
  const r = await S.mcp.callTool(NOTION, tool, input, {cache: refresh ? {...CACHE, refresh:true} : CACHE});
  return r;
}
/* GitHub Pages: data.json next to this page. Returns false when there is none. */
async function loadStatic(refresh){
  let data;
  try {
    const r = await fetch("data.json", {cache: refresh ? "no-cache" : "default"});
    if (!r.ok) return false;
    data = await r.json();
  } catch { return false; }
  if (!Array.isArray(data?.chars)) return false;
  S.static = true; S.error = null; S.ready = true;
  S.chars = data.chars.filter(c => c.id);
  S.details = {};
  for (const c of S.chars) S.details[c.id] = {ok:true, notes:c.notes || "", palette:c.palette || "", piece:c.piece || null};
  $("fresh").textContent = data.generatedAt ? `${fmtDate(Date.parse(data.generatedAt))} 時点` : "";
  $("reload").textContent = "再読み込み";
  if (S.sel && !current()) S.sel = null;
  if (!S.sel && S.chars.length && matchMedia("(min-width:761px)").matches) S.sel = grouped(filtered())[0]?.c.id || null;
  renderBanner(); renderList(); renderMain();
  return true;
}
async function load(refresh){
  if (S.static){ $("reload").disabled = true; await loadStatic(true); $("reload").disabled = false; return; }
  if (!S.mcp || S.loading) return;
  S.loading = true; $("reload").disabled = true;
  if (!S.ready) renderList();
  try {
    const rows = []; let cursor = null, storedAt = null, tries = 0;
    do {
      let r;
      try { r = await call("notion-query-data-sources", {data:{mode:"view", view_url:VIEW_URL, page_size:100, ...(cursor ? {start_cursor:cursor} : {})}}, refresh); }
      catch (e){
        if (e?.retryable && tries++ < 1){ await new Promise(ok => setTimeout(ok, (e.retryAfterMs || 1500) + Math.random()*500)); continue; }
        throw e;
      }
      const p = r.payload || {};
      rows.push(...(p.results || []));
      if (r.cache?.storedAt) storedAt = Math.min(storedAt ?? Infinity, r.cache.storedAt);
      cursor = p.has_more ? p.next_cursor : null;
    } while (cursor);
    S.chars = rows.map(toChar).filter(c => c.id);
    S.ready = true; S.error = null;
    $("fresh").textContent = storedAt ? `${fmtDate(storedAt)} 時点` : `${fmtDate(Date.now())} 時点`;
    if (S.sel && !current()) S.sel = null;
    if (!S.sel && S.chars.length && matchMedia("(min-width:761px)").matches) S.sel = grouped(filtered())[0]?.c.id || null;
  } catch (e){
    S.error = e || {code:"upstream_error"};
    if (["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","approval_required","consent_required"].includes(S.error.code)){ S.chars = []; S.ready = false; }
  } finally {
    S.loading = false; $("reload").disabled = false;
    renderBanner(); renderList(); renderMain();
  }
}

/* The page body (memo, chat palette, CCFolia piece) is read when a sheet is opened. */
function section(text, heading){
  const i = text.indexOf("## " + heading); if (i < 0) return "";
  const rest = text.slice(i).replace(/^## [^\n]*\n/, "");
  const j = rest.search(/\n## /);
  return (j < 0 ? rest : rest.slice(0, j)).trim();
}
const fenced = s => { const m = s.match(/```[^\n]*\n([\s\S]*?)\n```/); return m ? m[1] : ""; };
const unmark = s => s.replace(/<br\s*\/?>/g, "\n").replace(/<[^>]*>/g, "").replace(/\\([\\`*_{}\[\]()#+\-.!|<>~])/g, "$1")
  .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
async function loadDetail(c){
  const d = S.details[c.id];
  if (d && (d.loading || d.ok)) return;
  S.details[c.id] = {loading:true};
  try {
    const r = await call("notion-fetch", {id:c.id});
    const p = r.payload || {};
    const text = typeof p === "string" ? p : String(p.text || "");
    const body = (text.match(/<content>\n?([\s\S]*?)\n?<\/content>/) || [,""])[1];
    let piece = null; try { piece = JSON.parse(fenced(section(body, "ココフォリア駒"))); } catch {}
    S.details[c.id] = {ok:true, notes: unmark(section(body, "メモ")), palette: fenced(section(body, "チャットパレット")), piece};
  } catch (e){
    S.details[c.id] = {error: e || {code:"upstream_error"}};
  }
  if (S.sel === c.id) renderMain();
}

/* ---------- list ---------- */
/* Search: space-separated terms, all must match. A term matches the name, よみ, system, tags or a skill name.
   "目星70" / "目星>=70" keeps characters whose skill is at least that value; "目星<30" and "目星=50" work too. */
function parseTerms(q){
  return q.trim().toLowerCase().split(/[\s　]+/).filter(Boolean).map(t => {
    const m = t.match(/^(.+?)(>=|<=|＞＝|＜＝|>|<|＞|＜|=|＝)?(\d+)$/);
    if (m && !/^\d+$/.test(m[1])){
      const op = ({"＞＝":">=","＜＝":"<=","＞":">","＜":"<","＝":"="})[m[2]] || m[2] || ">=";
      return {text:m[1], op, n:Number(m[3]), raw:t};
    }
    return {text:t, raw:t};
  });
}
const CMP = {">=":(a,b)=>a>=b, "<=":(a,b)=>a<=b, ">":(a,b)=>a>b, "<":(a,b)=>a<b, "=":(a,b)=>a===b};
function skillHits(c, term){
  return (c.skills||[]).filter(s => String(s.label).toLowerCase().includes(term.text) &&
    (!term.op || CMP[term.op](num(s.value), term.n)));
}
function matchChar(c, terms){
  const hits = [];
  for (const t of terms){
    const sk = skillHits(c, t);
    const meta = [c.name,c.ruby,c.system,c.summary,...(c.tags||[])].join(" ").toLowerCase();
    if (t.op){ if (sk.length){ hits.push(...sk); continue; } if (meta.includes(t.raw)) continue; return null; }
    const inMeta = meta.includes(t.text);
    if (!inMeta && !sk.length) return null;
    if (!inMeta) hits.push(...sk);
  }
  return hits;
}
const isLost = c => (c.tags||[]).includes("ロスト");
function filtered(){
  const terms = parseTerms(S.q);
  const out = [];
  for (const c of S.chars){
    if (S.sys && c.system!==S.sys) continue;
    if (S.lost==="alive" && isLost(c) || S.lost==="lost" && !isLost(c)) continue;
    const hits = terms.length ? matchChar(c, terms) : [];
    if (hits) out.push({c, hits});
  }
  const sortTerm = terms.find(t=>t.op);
  if (sortTerm) out.sort((a,b) => Math.max(...skillHits(b.c,sortTerm).map(s=>num(s.value))) - Math.max(...skillHits(a.c,sortTerm).map(s=>num(s.value))));
  else out.sort((a,b) => a.c.name.localeCompare(b.c.name, "ja"));
  return out;
}
/* Same person: names compared after NFKC, without spaces and without a trailing （よみ）. */
function personKey(c){
  return String(c.name||"").normalize("NFKC").replace(/[(（][^()（）]*[)）]\s*$/,"").replace(/[\s　・]+/g,"").toLowerCase() || "#"+c.id;
}
function groupOf(c){ const k = personKey(c); return S.chars.filter(x => personKey(x)===k); }
function sheetLabel(c){
  return [c.system || "システム未設定", ...(c.tags||[]).filter(t=>!/^[67]版$/.test(t) && t!=="ロスト").slice(0,1)].join(" · ");
}
function grouped(items){
  if (!S.group) return items.map(x => ({...x, members:[x.c]}));
  const map = new Map();
  for (const x of items){
    const k = personKey(x.c);
    if (!map.has(k)) map.set(k, {c:x.c, hits:[], members:[]});
    const g = map.get(k); g.members.push(x.c); g.hits.push(...x.hits);
  }
  for (const g of map.values()) g.c = g.members.find(m=>m.id===S.sel) || g.members[0];
  return [...map.values()];
}
function renderList(){
  const nLost = S.chars.filter(isLost).length;
  for (const b of $("lostSeg").querySelectorAll("button")){
    const k = b.dataset.lost, n = k==="lost" ? nLost : k==="alive" ? S.chars.length - nLost : S.chars.length;
    b.setAttribute("aria-pressed", String(S.lost===k));
    b.innerHTML = `${({alive:"生存",lost:"ロスト",all:"すべて"})[k]}${S.ready ? `<small>${n}</small>` : ""}`;
  }
  const systems = [...new Set(S.chars.map(c=>c.system).filter(Boolean))];
  $("chips").innerHTML = systems.length>1 ? [["","すべて"],...systems.map(s=>[s,s])].map(([v,l]) =>
    `<button class="chip" type="button" data-sys="${esc(v)}" aria-pressed="${S.sys===v}">${esc(l)}</button>`).join("") : "";
  const list = $("list");
  if (!S.ready){
    $("count").textContent = "";
    list.innerHTML = `<li class="rack-empty">${S.loading || (!S.error && S.mcp !== null) ? "Notionから読み込んでいます…" : "Notionのキャラクターを表示できません。右の案内を確認してください。"}</li>`;
    return;
  }
  const items = grouped(filtered());
  const people = S.group ? new Set(S.chars.map(personKey)).size : S.chars.length;
  const unit = S.group ? "人" : "枚";
  $("count").textContent = (S.q.trim() || S.sys || S.lost!=="all" ? `${items.length} / ${people}${unit}` : `${people}${unit}`) + (S.group && people !== S.chars.length ? `（シート${S.chars.length}枚）` : "");
  if (!items.length){ list.innerHTML = `<li class="rack-empty">${S.chars.length ? "条件に合うキャラクターはいません。" : "Notionのシート帳にキャラクターがいません。拡張機能から追加できます。"}</li>`; return; }
  list.innerHTML = items.map(({c, hits, members}) => {
    const uniq = [...new Map(hits.map(s=>[s.label,s])).values()].slice(0,4);
    const many = members.length > 1;
    const sub = many ? [...new Set(members.map(m=>m.system).filter(Boolean))].join("・") || "—"
      : [c.system, c.summary].filter(Boolean).join(" · ") || "—";
    const lost = members.every(isLost);
    return `<li><button class="card${lost ? " is-lost" : ""}" type="button" data-id="${esc(c.id)}" aria-current="${members.some(m=>m.id===S.sel)}">
    ${avatarHTML(c,"avatar")}<span style="min-width:0"><div class="nm">${esc(c.name||"名無し")}${lost ? `<span class="lostmark">ロスト</span>` : ""}${many ? ` <span class="cnt">${members.length}枚</span>` : ""}</div>
    <div class="sub">${esc(sub)}</div>
    ${uniq.length ? `<div class="hits">${uniq.map(s=>`<span>${esc(s.label)} <b>${esc(s.value)}</b></span>`).join("")}</div>` : ""}</span></button></li>`;
  }).join("");
}

/* ---------- sheet ---------- */
function renderMain(){
  const m = $("main");
  $("app").classList.toggle("detail", !!S.sel);
  const c = current();
  if (!c){
    m.innerHTML = S.ready ? `<div class="empty"><h2>シートを選んでください</h2>
      <p>左の一覧からキャラクターを開くと、能力値・技能・メモ・チャットパレットをまとめて確認できます。HPやメモの編集はNotionで行います。</p></div>` : "";
    return;
  }
  const res = c.resources, stats = c.stats, skills = c.skills;
  const fam = S.group ? groupOf(c) : [c];
  const d = S.details[c.id] || {};
  if (!d.ok && !d.loading && !d.error) loadDetail(c);
  const detailNote = d.error ? `<p class="none">${esc(ERRORS[d.error.code] || "Notionからページの本文を読み込めませんでした。")}</p>` : `<p class="loading">Notionから読み込んでいます…</p>`;
  m.innerHTML = `<article class="sheet">
    <button class="btn sm back" type="button" data-act="back">← 一覧へ</button>
    ${fam.length > 1 ? `<nav class="sheets" aria-label="同じ人物のシート"><span class="lbl">この人物のシート ${fam.length}枚</span>
      ${fam.map(x=>`<button type="button" data-goto="${esc(x.id)}" aria-current="${x.id===c.id}">${esc(sheetLabel(x))}${isLost(x) ? `<span class="lostmark">ロスト</span>` : ""}<small>${x.updatedAt ? "更新 "+fmtDate(x.updatedAt) : ""}</small></button>`).join("")}</nav>` : ""}
    <section class="hero">
      ${avatarHTML(c, isLost(c) ? "portrait is-lost" : "portrait")}
      <div style="min-width:0">
        ${c.ruby ? `<div class="ruby">${esc(c.ruby)}</div>` : ""}
        <h2 class="name">${esc(c.name||"名無し")}${isLost(c) ? `<span class="lostmark" style="font-family:var(--f-body);font-size:.8rem">ロスト</span>` : ""}</h2>
        <div class="meta">
          ${c.system ? `<span class="pill">${esc(c.system)}</span>` : ""}
          ${c.tags.filter(t=>t!=="ロスト").map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
        </div>
        ${c.summary ? `<p class="summary">${esc(c.summary)}</p>` : ""}
        <p style="margin:10px 0 0;display:flex;gap:16px;flex-wrap:wrap">
          ${safeUrl(c.sourceUrl) ? `<a class="src" href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">元のシートを開く（${esc(c.sourceSite)}）↗</a>` : ""}
          <a class="src" href="${esc(c.id)}" target="_blank" rel="noopener">Notionで編集 ↗</a>
        </p>
        <div class="actions">
          <button class="btn sm" type="button" data-act="ccf" ${d.ok && d.piece ? "" : "disabled"}>ココフォリア駒をコピー</button>
          ${d.ok && d.palette ? `<button class="btn sm" type="button" data-act="pal">チャットパレットをコピー</button>` : ""}
        </div>
      </div>
    </section>
    ${res.length ? `<section class="sec"><h2>リソース</h2><div class="res">${res.map(r=>{
      const max=num(r.max), cur=num(r.cur), pct = max>0 ? Math.max(0,Math.min(100,cur/max*100)) : 0;
      return `<div class="resrow"><div class="hd"><span class="lb">${esc(r.label)}</span>
        <span class="num">${cur}<small> / ${max}</small></span></div>
        <div class="bar" style="--c:${RES_COLOR[r.label]||"var(--accent)"}"><i style="width:${pct}%"></i></div></div>`; }).join("")}</div></section>` : ""}
    ${stats.length ? `<section class="sec"><h2>能力値</h2><div class="stats">${stats.map(s=>`<div class="stat"><div class="lb">${esc(s.label)}</div><div class="v">${esc(s.value)}</div></div>`).join("")}</div></section>` : ""}
    <section class="sec"><h2>技能</h2>${skills.length ? `<ul class="skills">${skills.map(s=>`<li><span class="l">${esc(s.label)}</span><span class="d"></span><span class="v">${esc(s.value)}</span></li>`).join("")}</ul>` : `<p class="none">技能は登録されていません。</p>`}</section>
    <section class="sec"><h2>メモ・設定</h2>${d.ok ? (d.notes ? `<p class="notes">${esc(d.notes)}</p>` : `<p class="none">メモはありません。</p>`) : detailNote}</section>
    ${d.ok && d.palette ? `<section class="sec"><h2>チャットパレット</h2><pre class="palette">${esc(d.palette)}</pre></section>` : ""}
    ${c.updatedAt ? `<div class="stamp">Notionでの最終更新 ${fmtDate(c.updatedAt)}</div>` : ""}
  </article>`;
}

/* The CCFolia piece saved in Notion, with HP/MP/SAN taken from the current Notion values. */
function pieceText(c){
  const p = JSON.parse(JSON.stringify(S.details[c.id].piece));
  for (const s of p.data?.status || []){ const r = c.resources.find(x => x.label === s.label); if (r){ s.value = r.cur; s.max = r.max; } }
  return JSON.stringify(p);
}
function copyText(text, done){
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove(); toast(ok ? done : "コピーできませんでした。ブラウザの設定を確認してください。"); };
  try { navigator.clipboard.writeText(text).then(() => toast(done), fallback); } catch { fallback(); }
}

/* ---------- events ---------- */
$("search").addEventListener("input", e => { S.q = e.target.value; renderList(); });
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-sys]"); if (!b) return; S.sys = b.dataset.sys; renderList(); });
$("lostSeg").addEventListener("click", e => { const b = e.target.closest("[data-lost]"); if (!b) return; S.lost = b.dataset.lost; store.set("lostFilter", S.lost); renderList(); });
$("groupToggle").addEventListener("change", e => { S.group = e.target.checked; store.set("groupByName", S.group ? "1" : "0"); renderList(); renderMain(); });
$("list").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (!b) return; S.sel = b.dataset.id; renderList(); renderMain(); window.scrollTo(0,0); });
$("reload").addEventListener("click", () => { if (!S.static) S.details = {}; load(true); });
$("banner").addEventListener("click", e => { if (e.target.id === "allow") load(true); });
$("main").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g){ S.sel = g.dataset.goto; renderList(); renderMain(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const c = current();
  if (b.dataset.act === "back"){ S.sel = null; renderList(); renderMain(); }
  else if (b.dataset.act === "ccf" && c) copyText(pieceText(c), "ココフォリア駒をコピーしました。ココフォリアの盤面に貼り付けてください。");
  else if (b.dataset.act === "pal" && c) copyText(S.details[c.id].palette, "チャットパレットをコピーしました");
});

/* ---------- boot ---------- */
S.lost = ["alive","lost","all"].includes(store.get("lostFilter")) ? store.get("lostFilter") : "alive";
S.group = store.get("groupByName") !== "0";
$("groupToggle").checked = S.group;
S.mcp = undefined;
renderList(); renderMain();
(async () => {
  if (location.protocol.startsWith("http") && await loadStatic(false)) return;
  const mcp = window.claude?.use ? await window.claude.use("mcp") : null;
  S.mcp = mcp;
  if (!mcp){ S.error = {code:"not_granted"}; renderBanner(); renderList(); return; }
  load(false);
})();
</script>
