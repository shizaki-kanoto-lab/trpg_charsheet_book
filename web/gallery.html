<title>シザキカノトのTRPGキャラクター一覧</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<script>
/* Theme: "light" / "dark" chosen with the theme button, or follow the OS when nothing is saved.
   Shared by the sheet book and the gallery (same localStorage key). Runs before paint. */
(function(){ try { var t = localStorage.getItem("charsheet-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<style>
/* A character introduction page: a wall of portraits, and a profile page for each character.
   Reads the same data.json as the sheet book (index.html). */
:root{
  --bg:#F3EFE7; --paper:#FBF8F2; --ink:#1A1A22; --muted:#5E5B63; --line:#D9D2C5; --soft:#E9E3D7;
  --accent:#8E2E3B; --accent-2:#2D3F63; --band:#16151C; --band-ink:#F6F1E7;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111117; --paper:#18181F; --ink:#ECE6DA; --muted:#A7A2AC; --line:#2D2C36; --soft:#202029;
  --accent:#D9707E; --accent-2:#94A8D6; --band:#08080C; --band-ink:#F6F1E7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111117; --paper:#18181F; --ink:#ECE6DA; --muted:#A7A2AC; --line:#2D2C36; --soft:#202029;
  --accent:#D9707E; --accent-2:#94A8D6; --band:#08080C; --band-ink:#F6F1E7; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.8;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- hero ---------- */
.hero{padding-top:clamp(40px,7vw,80px);padding-bottom:clamp(24px,4vw,40px);text-align:center;position:relative}
.hero .eyebrow{font-family:var(--f-latin);font-style:italic;font-size:clamp(1rem,2vw,1.25rem);letter-spacing:.32em;color:var(--accent);margin:0}
.hero h1{font-family:var(--f-mincho);font-weight:800;font-size:clamp(2.6rem,9vw,5.6rem);letter-spacing:.18em;line-height:1.1;margin:.2em 0 .25em;padding-left:.18em}
.hero .sub{font-family:var(--f-mincho);font-weight:500;line-height:1.6;letter-spacing:.24em;font-size:clamp(.95rem,2.2vw,1.15rem);margin:.9em 0 0;color:var(--muted);padding-left:.24em}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 0;color:var(--accent);max-width:420px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.45}
.rule i{width:7px;height:7px;transform:rotate(45deg);border:1px solid currentColor;display:block}

/* ---------- filter ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 18px;margin:0 0 34px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px}
.tabs button{background:none;border:0;padding:6px 12px;font-family:var(--f-mincho);font-weight:700;letter-spacing:.08em;color:var(--muted);position:relative}
.tabs button small{font-family:var(--f-latin);font-size:.9em;margin-left:4px;opacity:.8}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .25s}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after,.tabs button:hover::after{transform:scaleX(1)}
.lostsw{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer;user-select:none}
.lostsw input{accent-color:var(--accent)}

/* ---------- grid ---------- */
.grid{list-style:none;margin:0;padding:0 0 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.tile{display:block;text-decoration:none;position:relative;container-type:inline-size;border-radius:2px;overflow:hidden;aspect-ratio:3/4;
  background:var(--h);isolation:isolate;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 10%,transparent);
  opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;
  background:repeating-linear-gradient(135deg,transparent 0 14px,rgb(255 255 255 / .07) 14px 15px),
             linear-gradient(160deg,rgb(255 255 255 / .16),transparent 55%)}
.tile .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mincho);font-weight:800;font-size:4.5rem;color:rgb(255 255 255 / .55)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .4s}
.tile:hover img,.tile:focus-visible img{transform:scale(1.045)}
.tile .band{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;color:var(--band-ink);
  background:linear-gradient(to top,color-mix(in srgb,var(--band) 92%,transparent) 0 58%,transparent)}
.tile .rb{display:block;font-size:.68rem;letter-spacing:.2em;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nm{display:block;font-family:var(--f-mincho);font-weight:700;font-size:1.12rem;letter-spacing:.14em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Hover: the first scenario's full name comes up in front of the picture. */
.tile .over{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:18px 4cqi 70px;text-align:center;color:#fff;opacity:0;transition:opacity .3s;pointer-events:none;
  background:linear-gradient(to bottom,rgb(10 10 16 / .72),rgb(10 10 16 / .5) 70%,transparent)}
.tile .over .ol{font-family:var(--f-latin);font-style:italic;letter-spacing:.24em;font-size:.82rem;opacity:.85}
/* Sized to the tile: about ten characters plus 『』 fit on one line. */
.tile .over .ot{font-family:var(--f-mincho);font-weight:800;font-size:clamp(.85rem,7.4cqi,1.3rem);letter-spacing:.04em;line-height:1.5;
  overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;
  transform:translateY(8px);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.tile .over .ot::before{content:"『"}.tile .over .ot::after{content:"』"}
.tile .over .on{font-size:.72rem;letter-spacing:.14em;opacity:.8}
.tile .over .on:empty{display:none}
.tile .band{z-index:2}
@media (hover:hover){
  .tile:hover .over,.tile:focus-visible .over{opacity:1}
  .tile:hover .over .ot,.tile:focus-visible .over .ot{transform:none}
  .tile:hover .fs,.tile:focus-visible .fs{visibility:hidden}
}
.tile .fs{display:block;margin-top:2px;font-family:var(--f-mincho);font-size:.72rem;letter-spacing:.06em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .fs:not(.plain)::before{content:"『"}.tile .fs:not(.plain)::after{content:"』"}
.tile .sys{display:block;width:max-content;max-width:100%;margin:6px 0 0 auto;font-size:.62rem;letter-spacing:.12em;padding:0 7px;border:1px solid rgb(255 255 255 / .55);color:rgb(255 255 255 / .9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.lost img{filter:grayscale(1) contrast(.95) brightness(.85)}
.tile.lost .sys::after{content:" ／ LOST";color:#ffb3bd}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@keyframes rise{to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--muted);padding:60px 0}

/* ---------- profile ---------- */
.hero .sub .nb{display:inline-block}
.prof{padding-top:32px;padding-bottom:90px}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;font-size:.88rem}
.crumbs a{text-decoration:none;color:var(--muted);letter-spacing:.1em}
.crumbs a:hover{color:var(--accent)}
.pager{display:flex;gap:16px}
.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);align-items:start}
.figure{position:sticky;top:24px}
.stage{position:relative;aspect-ratio:3/4;background:var(--h);overflow:hidden;border-radius:2px}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 18px,rgb(255 255 255 / .07) 18px 19px)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.stage .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mincho);font-weight:800;font-size:7rem;color:rgb(255 255 255 / .5)}
.stage.lost img{filter:grayscale(1)}
.vert{position:absolute;top:16px;right:14px;writing-mode:vertical-rl;font-family:var(--f-latin);font-style:italic;letter-spacing:.3em;color:rgb(255 255 255 / .8);font-size:.95rem;text-shadow:0 1px 6px rgb(0 0 0 / .4)}
.cap{margin-top:8px;font-size:.78rem;color:var(--muted);text-align:right}
.cap a{text-decoration:none}
.cap a:hover{color:var(--accent)}

.pill{display:inline-block;font-size:.75rem;letter-spacing:.14em;padding:2px 12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px}
.pill.lost{border-color:var(--muted);color:var(--muted)}
.pname{font-family:var(--f-mincho);font-weight:800;font-size:clamp(2rem,5vw,3.1rem);letter-spacing:.12em;line-height:1.25;margin:14px 0 4px;overflow-wrap:anywhere}
.pruby{font-family:var(--f-mincho);letter-spacing:.3em;color:var(--muted);margin:0 0 6px}
.prole{font-family:var(--f-latin);font-style:italic;font-size:1.25rem;color:var(--accent);margin:0}
.sheets{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.sheets button{border:1px solid var(--line);background:var(--paper);padding:3px 12px;font-size:.8rem;border-radius:2px;color:var(--muted)}
.sheets button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.sec{margin-top:40px}
.sec h2{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;font-family:var(--f-mincho);font-weight:700;font-size:1.05rem;letter-spacing:.2em}
.sec h2 .en{font-family:var(--f-latin);font-style:italic;font-weight:500;font-size:1.35rem;letter-spacing:.06em;color:var(--accent)}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);margin:0;border-top:1px solid var(--line)}
.dl dt,.dl dd{margin:0;padding:9px 14px;border-bottom:1px solid var(--line)}
.dl dt{font-size:.82rem;letter-spacing:.2em;color:var(--muted);background:color-mix(in srgb,var(--soft) 60%,transparent)}
.dl dd{font-family:var(--f-mincho);font-weight:500;overflow-wrap:anywhere}
.story{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-family:var(--f-mincho);font-size:1rem;line-height:2.05}
.more{margin-top:8px;background:none;border:0;padding:0;color:var(--accent);font-size:.85rem;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--paper);padding:8px 10px 6px;text-align:center}
.stat .k{font-family:var(--f-latin);font-weight:600;letter-spacing:.14em;font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--f-latin);font-weight:600;font-size:1.65rem;line-height:1.1}
.res{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.res b{font-family:var(--f-latin);font-size:1.15rem;color:var(--ink);margin-left:6px}
.skills{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 26px}
.skills li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;padding:5px 0 3px;border-bottom:1px dotted var(--line);position:relative}
.skills li .l{overflow-wrap:anywhere;font-size:.92rem}
.skills li .v{font-family:var(--f-latin);font-weight:600;font-size:1.1rem}
.skills li::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:calc(var(--p) * 1%);background:var(--accent);opacity:.55}
.tl-open{margin-top:12px;background:none;border:0;padding:0;color:var(--accent);font-size:.85rem;letter-spacing:.1em;cursor:pointer;text-align:left}
.tl-open:hover{text-decoration:underline;text-underline-offset:3px}
dialog.tl{width:min(680px,calc(100vw - 32px));max-height:min(80vh,calc(100dvh - 32px));padding:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);box-shadow:0 18px 48px rgba(0,0,0,.28)}
dialog.tl::backdrop{background:rgba(10,10,14,.55)}
dialog.tl .hd{position:sticky;top:0;display:flex;align-items:baseline;gap:12px;padding:18px 20px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
dialog.tl .hd h2{margin:0;font-family:var(--f-mincho);font-weight:700;font-size:1.05rem;letter-spacing:.16em;flex:1}
dialog.tl .hd small{display:block;font-family:var(--f-latin);font-style:italic;color:var(--accent);letter-spacing:.06em;font-size:1rem}
dialog.tl .x{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;color:var(--ink);cursor:pointer;font-size:1.1rem;line-height:1}
dialog.tl .x:hover{border-color:var(--accent);color:var(--accent)}
dialog.tl .bd{padding:4px 20px 20px}
dialog.tl .grp{margin:18px 0 4px;font-size:.78rem;letter-spacing:.14em;color:var(--muted)}
.tline{list-style:none;margin:0;padding:0}
.tline li{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--line)}
.tline .d{font-family:var(--f-latin);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.tline .t{font-family:var(--f-mincho);font-weight:500;overflow-wrap:anywhere}
.tline .t .r{margin-left:8px;font-family:inherit;font-size:.75rem;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:0 6px;white-space:nowrap}
.tline .s{font-size:.72rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
@media (max-width:520px){.tline li{grid-template-columns:minmax(0,1fr) auto}.tline .d{grid-column:1/-1}}
.scen{list-style:none;margin:0;padding:0;display:grid;gap:0}
.scen li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)}
.scen li .no{font-family:var(--f-latin);font-style:italic;color:var(--accent);font-size:1rem;min-width:2ch}
.scen li .t{font-family:var(--f-mincho);font-weight:500;overflow-wrap:anywhere}
.scen li .r{font-size:.75rem;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:0 8px;white-space:nowrap}
/* ---------- HO傾向 (#ho) ----------
   The same page the sheet book had, in the gallery's colors: its tokens are mapped below. */
.ho-link{display:inline-block;margin-top:18px;font-size:.85rem;letter-spacing:.14em;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.ho-link:hover{opacity:.8}
.ho{--surface:var(--paper);--surface-2:var(--soft);--copper:var(--accent);--f-display:var(--f-mincho);--f-mono:var(--f-latin);--f-body:var(--f-sans);padding-bottom:60px}
.ho{--ho1:#2a78d6;--ho2:#eb6834;--ho3:#1baf7a;--ho4:#eda100;--ho5:#e87ba4;--ho6:#008300;
  --pl1:#6da7ec;--pl2:#3987e5;--pl3:#256abf;--pl4:#184f95;--pl5:#0d366b;--plx:#9a968f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ho{--ho1:#3987e5;--ho2:#d95926;--ho3:#199e70;--ho4:#c98500;--ho5:#d55181;--ho6:#0ca30c;
  --pl1:#184f95;--pl2:#256abf;--pl3:#3987e5;--pl4:#6da7ec;--pl5:#9ec5f4;--plx:#6b6872}}
:root[data-theme="dark"] .ho{--ho1:#3987e5;--ho2:#d95926;--ho3:#199e70;--ho4:#c98500;--ho5:#d55181;--ho6:#0ca30c;
  --pl1:#184f95;--pl2:#256abf;--pl3:#3987e5;--pl4:#6da7ec;--pl5:#9ec5f4;--plx:#6b6872}
.ho .hochart .col i{background:var(--c,var(--accent))}
.ho .hopage{font-size:15px;font-variant-numeric:lining-nums tabular-nums}
.ho .lostmark{font-size:.75rem;font-weight:700;white-space:nowrap;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:8px;vertical-align:1px}
.ho .role{display:inline-block;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:4px;padding:0 7px;font-weight:700;font-size:.8rem;margin-right:8px;vertical-align:1px}
.ho .lostx{font-size:.8rem;margin-right:6px;vertical-align:1px}
.ho .none{color:var(--muted);font-size:.9rem}
.ho button{font:inherit;cursor:pointer}
.ho .back{display:block;width:max-content;margin:40px auto 0;font-size:.85rem;letter-spacing:.14em;color:var(--accent);text-decoration:none}
.hopage{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ho-chips{display:flex;flex-wrap:wrap;gap:6px}
.ho-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:.84rem;color:var(--muted)}
.ho-chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.hocard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px 16px}
.hocard h2{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.1em}
.hocard .sub{margin:0 0 14px;color:var(--muted);font-size:.84rem}
.hocard .sub b{font-family:var(--f-mono);color:var(--ink);font-size:1rem;margin:0 2px}
.hochart{position:relative;padding-left:2.2em}
/* Each column keeps the width it has with every slot (--n); slots that can't happen are left out and the rest are centred (--m). */
.hochart .plot{position:relative;height:240px;margin-top:12px;display:grid;grid-template-columns:repeat(var(--m),calc(100% / var(--n)));justify-content:center;gap:0;align-items:end;border-bottom:1px solid var(--muted)}
.hochart .gl{position:absolute;left:0;right:0;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);pointer-events:none}
.hochart .gl span{position:absolute;right:calc(100% + 8px);top:-.75em;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);line-height:1.5}
.hochart .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.hochart .col i{display:block;width:min(56px,62%);height:var(--h);background:var(--accent);border-radius:4px 4px 0 0;transition:opacity .15s}
.hochart .col .v{position:absolute;bottom:calc(var(--h) + 4px);left:0;right:0;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.hochart .col:hover i{opacity:.8}
.hochart .col[aria-pressed="true"] i{outline:2px solid var(--copper);outline-offset:2px}
.hochart .col:focus-visible{outline:none}
.hochart .col:focus-visible i{outline:2px solid var(--ink);outline-offset:2px}
.hochart .xs{display:grid;grid-template-columns:repeat(var(--m),calc(100% / var(--n)));justify-content:center;gap:0;margin-top:6px}
.hochart .xs span{text-align:center;font-family:var(--f-mono);font-size:.84rem;color:var(--muted)}
.hotip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.8rem;box-shadow:0 6px 20px rgb(0 0 0 / .14);white-space:nowrap;transform:translate(-50%,-100%)}
.hotip b{font-family:var(--f-mono)}
/* How the page counts: a boxed note with an info mark. */
.honote{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent-2);border-radius:8px;padding:12px 16px;color:var(--muted);font-size:.84rem;line-height:1.7}
.honote svg{width:18px;height:18px;margin-top:2px;color:var(--accent-2)}
/* The first line stays; the rest is folded under くわしく until opened (kept open across redraws). */
.honote summary{cursor:pointer;list-style:none;color:var(--ink)}
.honote summary::-webkit-details-marker{display:none}
.honote .more{margin-left:.6em;color:var(--accent);white-space:nowrap;font-size:.8rem}
.honote .more::after{content:" ▸"}
.honote details[open] .more::after{content:" ▾"}
.honote ul{margin:4px 0 0;padding-left:1.2em}
.hochart .col.zero{cursor:default}
.hoacc{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hoitem{border-top:1px solid var(--line);interpolate-size:allow-keywords}
.hoitem:first-child{border-top:0}
.hoitem summary,.hoitem.zero{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:10px 14px;list-style:none}
.hoitem summary{cursor:pointer}
.hoitem summary::-webkit-details-marker{display:none}
.hoitem summary:hover{background:var(--surface-2)}
.hoitem .k{font-family:var(--f-latin);font-weight:600;font-size:1.3rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.hoitem .sw{display:block;width:12px;height:12px;border-radius:3px;background:var(--c)}
.hoitem .n{font-family:var(--f-mono);font-size:.9rem;white-space:nowrap}
.hoitem.zero{color:var(--muted)}
.hoitem.zero .k{font-weight:500}
.hoitem .chev{width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.hoitem[open] .chev{transform:rotate(225deg) translate(-2px,-2px)}
.hoitem.zero .chev{visibility:hidden}
/* びよっと: the body grows from 0 with a little overshoot (Chrome animates the details content; elsewhere it just opens). */
.hoitem::details-content{block-size:0;overflow:hidden;transition:block-size .38s cubic-bezier(.34,1.45,.55,1),content-visibility .38s allow-discrete}
.hoitem[open]::details-content{block-size:auto}
.hoitem[open] .hobody{animation:hopop .38s cubic-bezier(.34,1.45,.55,1)}
@keyframes hopop{from{opacity:0;transform:translateY(-6px) scaleY(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hoitem::details-content{transition:none}.hoitem[open] .hobody{animation:none}}
.hobody{padding:4px 14px 10px;border-top:1px solid var(--line);background:var(--soft);transform-origin:top}
.horuns{list-style:none;margin:0;padding:0}
.horuns li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line)}
.horuns li:last-child{border-bottom:0}
.horuns .t{font-family:var(--f-display);font-weight:500;font-size:.95rem;overflow-wrap:anywhere}
.horuns .who{white-space:nowrap}
.horuns .who a{color:var(--ink)}
.horuns .who .role{margin:0 0 0 8px}
.horuns .who .lostmark{margin:0 8px 0 0}
.horuns li.is-lost .who a{color:var(--muted)}
@media (max-width:520px){.horuns li{grid-template-columns:1fr}.horuns .who{white-space:normal}.hoitem .pc{display:none}}
.hoaxis{display:inline-grid;grid-template-columns:1fr 1fr;width:max-content;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hoaxis button{border:0;background:var(--surface);padding:4px 14px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.hoaxis button+button{border-left:1px solid var(--line)}
.hoaxis button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.horuns .plk{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin-left:8px}
.hotabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hotabs button{flex:none;border:0;background:none;padding:6px 14px 8px;font-size:.92rem;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.hotabs button small{font-family:var(--f-mono);font-weight:400;font-size:.76rem;margin-left:6px;opacity:.85}
.hotabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}
.hotabs button:hover{color:var(--ink)}
.foot{text-align:center;color:var(--muted);font-family:var(--f-latin);letter-spacing:.2em;font-size:.85rem;padding:20px 16px 40px}
.foot .crowla{display:block;width:min(240px,64vw);height:auto;margin:0 auto 14px}
.foot .crowla.d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .foot .crowla.l{display:none}:root:not([data-theme="light"]) .foot .crowla.d{display:block}}
:root[data-theme="dark"] .foot .crowla.l{display:none}
:root[data-theme="dark"] .foot .crowla.d{display:block}

@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tabs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}
  .tabs button{flex:none;white-space:nowrap}
  .tile .nm{font-size:.98rem;letter-spacing:.08em}
  .layout{grid-template-columns:1fr}
  .figure{position:static;max-width:420px;width:100%;margin:0 auto}
}
/* Back to the top: a button at the bottom right while scrolled down, and a pull past the bottom. */
/* Theme button: fixed at the top right. */
.themesw{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:20;
  width:42px;height:42px;box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.themesw:hover{border-color:var(--accent);color:var(--accent)}
.themesw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.themesw svg{width:18px;height:18px;display:none}
.themesw[data-mode="auto"] .i-auto,.themesw[data-mode="light"] .i-light,.themesw[data-mode="dark"] .i-dark{display:block}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{border-color:var(--accent);color:var(--accent)}
.totop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.totop svg{width:20px;height:20px}
.pull{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:19;transform:translate(-50%,var(--y,40px));
  display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:999px;background:var(--band);color:var(--band-ink);
  font-size:.82rem;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.pull.on{opacity:1}
.pull .ring{--p:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1turn),color-mix(in srgb,var(--band-ink) 22%,transparent) 0)}
.pull .ring::before{content:"";grid-area:1/1;width:20px;height:20px;border-radius:50%;background:var(--band)}
.pull .ring svg{grid-area:1/1;width:13px;height:13px;transition:transform .2s}
.pull.ready .ring svg{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .totop,.pull,.pull .ring svg{transition:none}
  .tile{animation:none;opacity:1;transform:none}
  .tile img,.tile .over,.tile .over .ot{transition:none}
}
</style>

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PMZQ73GV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div id="root"></div>
<button class="themesw" type="button"><svg class="i-auto" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg><svg class="i-light" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg><svg class="i-dark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z"/></svg></button>
<button class="totop" id="totop" type="button" aria-label="ページの先頭へ戻る" title="ページの先頭へ戻る" tabindex="-1"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg></button>
<div class="pull" id="pull" aria-hidden="true"><span class="ring"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg></span><span class="txt">引っぱって先頭へ</span></div>
<script>

// Theme button: OS設定 → ライト → ダーク → OS設定 …
(function(){
  const KEY = "charsheet-theme", LABEL = { auto: "OSの設定に合わせる", light: "ライトモード", dark: "ダークモード" }, NEXT = { auto: "light", light: "dark", dark: "auto" };
  const read = () => { try { const t = localStorage.getItem(KEY); return t === "light" || t === "dark" ? t : "auto"; } catch { return "auto"; } };
  const apply = mode => {
    if (mode === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
    for (const b of document.querySelectorAll(".themesw")) {
      b.dataset.mode = mode;
      const t = `表示：${LABEL[mode]}（押すと${LABEL[NEXT[mode]]}）`;
      b.title = t; b.setAttribute("aria-label", t);
    }
  };
  document.addEventListener("click", e => {
    const b = e.target.closest(".themesw"); if (!b) return;
    const mode = NEXT[read()];
    try { mode === "auto" ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, mode); } catch {}
    apply(mode);
  });
  addEventListener("storage", e => { if (e.key === KEY) apply(read()); });
  apply(read());
})();
const $ = id => document.getElementById(id);
/* A picture that fails to load (a slow phone line, or the site being replaced while it loads) is tried
   again twice before it is given up; the site's own copies (img/…) get a fresh URL to skip a cached error. */
function imgRetry(img){
  const n = Number(img.dataset.retry || 0) + 1;
  if (n > 2){ img.remove(); return; }
  img.dataset.retry = n;
  const src = img.getAttribute("src").replace(/[?&]r=\d+$/, "");
  setTimeout(() => { if (img.isConnected) img.src = /^img\//.test(src) ? `${src}?r=${n}` : src; }, 1500 * n);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const store = {get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }};
function hue(str){ let h=0; for (const c of String(str)) h=(h*31+c.codePointAt(0))%360; return h; }
const tint = n => `hsl(${hue(n)} 30% 34%)`;
const okImg = u => /^https?:\/\//.test(String(u||"")) || /^img\/[0-9a-f]+\.(png|jpg|gif|webp)$/.test(String(u||""));
const isLost = c => (c.tags||[]).includes("ロスト");
const SYS_SHORT = {"クトゥルフ神話TRPG 6版":"CoC6th", "クトゥルフ神話TRPG 7版":"CoC7th", "エモクロアTRPG":"emoklore", "ガイアケアTRPG":"GaiaCare",
  "ダブルクロス The 3rd Edition":"Double Cross", "ケダモノオペラ":"Kedamono Opera", "ほうかご探報":"Houkago Tanpou", "ソード・ワールド2.5":"SW 2.5", "ソード・ワールド2.0":"SW 2.0"};
const sysShort = s => SYS_SHORT[s] || s || "";
const NO_SCENARIOS = new Set(["ケダモノオペラ"]);
/* System order: CoC 6th, CoC 7th, Emoklore, then the rest in 50音順. */
const SYS_FIRST = ["クトゥルフ神話TRPG 6版", "クトゥルフ神話TRPG 7版", "エモクロアTRPG"];
const sysRank = s => { const i = SYS_FIRST.indexOf(s); return i < 0 ? SYS_FIRST.length : i; };
const bySystem = (a, b) => sysRank(a) - sysRank(b) || String(a||"").localeCompare(String(b||""), "ja");
const sysJa = s => String(s||"その他").replace(/TRPG\s*/,"").replace(/ The 3rd Edition/,"").replace(/ THE AXLERATION/i,"").replace(/^クトゥルフ神話/,"クトゥルフ");
/* Same person as in the sheet book: NFKC, no spaces, no trailing （よみ）. */
const personKey = c => String(c.name||"").normalize("NFKC").replace(/[(（][^()（）]*[)）]\s*$/,"").replace(/[\s　・]+/g,"").toLowerCase() || "#"+c.id;
const shortName = n => String(n||"名無し").replace(/\s*[(（][^()（）]*[)）]\s*$/, "") || n;
const rubyOf = c => c.ruby || ((String(c.name||"").match(/[(（]([^()（）]*)[)）]\s*$/)||[])[1]) || "";

/* Scenario tags, same rules as the sheet book: an HO is written after the name or is a tag of its own. */
const META_TAG = /^(?:[67]版|ロスト|.*コンバート|CoC転生|要確認)$/;
const HO_AT = "HO(?=[0-9０-９:：\\-－α-ωΑ-Ω\\u3040-\\u30ff\\u3400-\\u9fff\\uff10-\\uff19]|$)";
const ROLE_ONLY = new RegExp(`^(?:${HO_AT}|PC\\d|KPC$|NPC$|[KG]Pレス$|GMレス$)`);
// KPC / NPC / KPレス・GMレス (技能成長シナリオ) only at the very end: 「…KPCを攻略なんて聞いてませんが！？」 is part of a scenario name.
const ROLE_SUFFIX = new RegExp(`^(.+?)((?:${HO_AT}|PC\\d).*|KPC|NPC|[KG]Pレス|GMレス)$`);
function scenariosOf(c){
  const out = []; let pending = "";
  for (const t of (c.tags||[]).filter(t => !META_TAG.test(t))){
    if (ROLE_ONLY.test(t)){ const last = out[out.length-1]; if (last && !last.role) last.role = t; else pending = t; continue; }
    const m = t.match(ROLE_SUFFIX);
    const date = (c.dates || {})[t] || "";   // the 卓報告 date of this line (from 通過記録), when known
    const pl = (c.pls || {})[t] || "";       // its PL人数 from 通過記録 ("不明" when empty; "" = no 通過記録 row)
    const series = (c.series || {})[t] || "";   // 通過記録's シリーズ: an episode of a scenario told in episodes
    out.push(m ? {name:m[1].trim(), role:m[2], date, pl, series} : {name:t, role:pending, date, pl, series});
    pending = "";
  }
  return out;
}
/* Every scenario of the person, whatever the system, in the order played: lines with a 卓報告 date
   (from 通過記録) by date, then the undated ones in sheet order. The same line on two sheets (a 6版 and
   a 7版 sheet of one character) is listed once. */
function timelineOf(p){
  const seen = new Set(), all = [];
  for (const c of [...p.sheets].sort((a,b) => bySystem(a.system, b.system))) for (const x of scenariosOf(c)){
    const k = `${x.name.normalize("NFKC").replace(/\s+/g, "")}|${x.role}|${x.date}`;
    if (seen.has(k)) continue;
    seen.add(k); all.push({...x, system: c.system});
  }
  return {dated: all.filter(x => x.date).sort((a,b) => a.date.localeCompare(b.date)), undated: all.filter(x => !x.date)};
}
function timelineHTML(p){
  const {dated, undated} = timelineOf(p);
  const row = x => `<li><span class="d">${esc(x.date ? x.date.replace(/-/g, ".") : "")}</span><span class="t">${esc(x.name)}${x.role ? `<span class="r">${esc(x.role)}</span>` : ""}</span><span class="s">${esc(sysJa(x.system))}</span></li>`;
  return `<dialog class="tl" id="tl" aria-labelledby="tlTitle">
    <div class="hd"><h2 id="tlTitle"><small>All Scenarios</small>${esc(p.name)}の通過シナリオ（全システム・時系列）</h2><button class="x" type="button" data-tl="close" aria-label="閉じる">×</button></div>
    <div class="bd">
      ${dated.length ? `<ol class="tline">${dated.map(row).join("")}</ol>` : ""}
      ${undated.length ? `<p class="grp">日付の分からないシナリオ（シートの順）</p><ol class="tline">${undated.map(row).join("")}</ol>` : ""}
    </div></dialog>`;
}
/* Notes start with "職業: …" lines (written by the importer); the rest is the character's text.
   The known keys (and フタリソウサ's パートナー) go to the profile, the PL line is dropped, and other
   "key: value" lines at the top (役割, 外見, …) stay in the text. */
const PROFILE_KEYS = ["職業","年齢","性別","身長","体重","出身","パートナー"];
function splitNotes(notes){
  const profile = [], rest = [];
  let top = true;
  for (const line of String(notes||"").split("\n")){
    const m = top && line.match(/^([^\s:：]{1,10})\s*[:：]\s*(.+)$/);
    if (!m){ if (line.trim()) top = false; rest.push(line); continue; }
    if (PROFILE_KEYS.includes(m[1])) profile.push([m[1], m[2].trim()]);
    else if (m[1] !== "PL") rest.push(line);
  }
  return {profile, text: rest.join("\n").replace(/^\s+|\s+$/g, "")};
}

const S = {chars:[], people:[], sys: store.get("gSys") || "", lost: store.get("gLost") === "1", sheet:{}};

/* One entry per person; the face is the picture of the sheet with the most scenarios. */
function buildPeople(){
  const map = new Map();
  for (const c of S.chars){
    const k = personKey(c);
    if (c.galleryHidden) continue;          // ギャラリー非表示 = 非表示 in Notion
    if (!map.has(k)) map.set(k, {key:k, sheets:[]});
    map.get(k).sheets.push(c);
  }
  // Only characters who have played a scenario; once they have, every sheet of theirs is shown.
  // ケダモノオペラ has no scenario list, so its characters are always shown.
  const people = [...map.values()].filter(p => p.sheets.some(c => scenariosOf(c).length || NO_SCENARIOS.has(c.system)));
  for (const p of people){
    p.sheets.sort((a,b) => (isLost(a)-isLost(b)) || (b.updatedAt||0)-(a.updatedAt||0));
    // The face: the picture of the sheet with the most scenarios played (the newest when tied).
    p.face = [...p.sheets].sort((a,b) => (isLost(a)-isLost(b)) || scenariosOf(b).length - scenariosOf(a).length || (b.updatedAt||0)-(a.updatedAt||0))
      .find(c => okImg(c.image)) || p.sheets[0];
    p.name = shortName(p.sheets[0].name);
    p.ruby = p.sheets.map(rubyOf).find(Boolean) || "";
    p.lost = p.sheets.every(isLost);
    p.systems = [...new Set(p.sheets.map(c => c.system).filter(Boolean))].sort(bySystem);
    // The profile's sheet tabs, in the list's system order.
    p.tabs = [...p.sheets].sort((a,b) => bySystem(a.system, b.system));
    // Scenarios across all of the person's sheets; one played under two systems counts once.
    // すべて: the scenario played first in time, whatever the system (by its 卓報告 date). Without
    // dates, the first scenario on the sheet listed first by system (CoC6th, CoC7th, emoklore, …).
    const inOrder = [...p.sheets].sort((a,b) => bySystem(a.system, b.system)).flatMap(scenariosOf);
    const dated = inOrder.filter(x => x.date).sort((a,b) => a.date.localeCompare(b.date));
    p.first = ((dated[0] || inOrder[0]) || {}).name || "";
    p.played = new Set(p.sheets.flatMap(c => scenariosOf(c).map(x => x.name.normalize("NFKC").replace(/\s+/g, "")))).size;
  }
  // Most scenarios played first, whatever the system.
  people.sort((a,b) => b.played - a.played || (a.ruby||a.name).localeCompare(b.ruby||b.name, "ja"));
  S.people = people;
}
// With a system tab chosen, most scenarios played in that system first; すべて keeps the all-system order.
const visible = () => {
  const list = S.people.filter(p => (S.lost || !p.lost) && (!S.sys || p.systems.includes(S.sys)));
  if (!S.sys) return list;
  const n = new Map(list.map(p => [p, scenOf(p).played]));
  return list.sort((a,b) => n.get(b) - n.get(a) || b.played - a.played || (a.ruby||a.name).localeCompare(b.ruby||b.name, "ja"));
};

/* The scenarios a tile shows: with a system tab chosen, only that system's sheets count. */

/* ---------- HO傾向 (#ho): which HO numbers come up most ----------
   One count per person and scenario: a scenario on a 6版 and a 7版 sheet of one character counts once,
   and so do the episodes of a series (通過記録's シリーズ). "HO1なになに" / "HO-1" / "PC1" count as 1, the
   number right after HO or PC; "HO1兼HO2" counts under both. An HO with a name only (HO蜘蛛) has no number
   and is listed apart. Only lines with a 通過記録 row count (S.people already leaves out ギャラリー非表示). */
const HO_MAX = 5;
// The HO numbers at the start of the role, and how long that part is. A number that runs into a word
// such as 代 or 時 ("HO310代後半の男性") is HO3 and a name "10代後半の男性". 兼任 only counts when it comes
// right after the first number ("HO1兼HO2", "HO1・2"): a "、9時" later in the name is not one.
const HO_UNIT = /^[代歳才時分秒年月日人回]/;
function hoLead(role){
  const r = String(role||"").normalize("NFKC");
  const m = r.match(/^(?:HO|PC)[\s:：\-－]*(\d+)/i);
  if (!m) return {ns: [], len: 0};
  const num = (d, after) => d.length > 1 && HO_UNIT.test(after) ? d[0] : d;
  const first = num(m[1], r.slice(m[0].length));
  let len = m[0].length - m[1].length + first.length;
  const ns = [Number(first)];
  if (first === m[1]) {
    const more = /(?:兼|[・&/,、＆／])\s*(?:HO|PC)?[\s\-－]*(\d+)/iy;
    for (let x; more.lastIndex = len, (x = more.exec(r)) && !HO_UNIT.test(r.slice(more.lastIndex)); len = more.lastIndex)
      if (!ns.includes(Number(x[1]))) ns.push(Number(x[1]));
  }
  return {ns, len};
}
const hoNumbers = role => hoLead(role).ns;
const isHoRole = role => /^(?:HO|PC\d)/i.test(String(role||"").normalize("NFKC"));
const HO_S = {sys: "", axis: "pl", pl: "", hoTab: "", noteOpen: false};
// くわしく stays as it was when the page redraws (a chip or tab press rebuilds it). toggle doesn't bubble.
document.addEventListener("toggle", e => { if (e.target.matches?.("[data-honote]")) HO_S.noteOpen = e.target.open; }, true);
function hoRuns(){
  const by = new Map();
  for (const p of S.people) for (const c of p.sheets) for (const x of scenariosOf(c)){
    const name = x.series || x.name, k = p.key + "|" + name.normalize("NFKC").replace(/\s+/g, "");
    const r = by.get(k);
    if (!r){ by.set(k, {p, c, name, role: x.role, pl: x.pl}); continue; }
    // The 7版 copy of a sheet may say just "HO5" where the 6版 one says "HO5警察組織所属": keep the one with the name.
    if (!r.role || (x.role && x.role.length > r.role.length && x.role.normalize("NFKC").startsWith(r.role.normalize("NFKC")))) r.role = x.role;
    if (!r.pl) r.pl = x.pl;
    if ((c.updatedAt||0) > (r.c.updatedAt||0)) r.c = c;
  }
  return [...by.values()].filter(r => isHoRole(r.role) && r.pl).map((r, id) => ({...r, id, ns: hoNumbers(r.role)}));
}
function renderHo(){
  const runs = hoRuns();
  const systems = [...new Set(runs.map(r => r.c.system).filter(Boolean))].sort(bySystem);
  if (HO_S.sys && !systems.includes(HO_S.sys)) HO_S.sys = "";
  const inSys = runs.filter(r => !HO_S.sys || r.c.system === HO_S.sys);
  // Two ways round: PL人数 tabs with a bar per HO (axis "pl"), or HO tabs with a bar per PL人数 (axis "ho").
  const PLS = ["1PL", "2PL", "3PL", "4PL", "5PL以上"];
  const plOf = r => PLS.includes(r.pl) ? r.pl : "不明";
  const hoOf = r => r.n > HO_MAX ? `HO${HO_MAX+1}〜` : `HO${r.n}`;
  // One entry per HO number: a 兼任 run is in two bars.
  const allNum = inSys.flatMap(r => r.ns.map(n => ({...r, n})));
  const distinct = list => new Set(list.map(r => r.id)).size;
  const plKeys = [...PLS, ...(allNum.some(r => plOf(r) === "不明") ? ["不明"] : [])];
  const hoKeys = [...[...Array(HO_MAX).keys()].map(i => `HO${i+1}`), ...(allNum.some(r => r.n > HO_MAX) ? [`HO${HO_MAX+1}〜`] : [])];
  const byPl = HO_S.axis !== "ho";
  const tabOf = byPl ? plOf : hoOf, binOf = byPl ? hoOf : plOf;
  const NAMED = "番号なし", allNamed = inSys.filter(r => !r.ns.length);
  const tabs = [...(byPl ? plKeys : hoKeys).map(k => ({k, n: distinct(allNum.filter(r => tabOf(r) === k))})), ...(allNamed.length ? [{k: NAMED, n: allNamed.length}] : [])];
  const cur = byPl ? "pl" : "hoTab";
  if (!tabs.some(t => t.k === HO_S[cur])) HO_S[cur] = (byPl ? tabs.find(t => t.k === "2PL" && t.n) : null)?.k || (tabs.find(t => t.n) || tabs[0]).k;
  const tabKey = HO_S[cur];
  const numbered = allNum.filter(r => tabOf(r) === tabKey), total = distinct(numbered);
  const shared = numbered.filter(r => r.ns.length > 1).length > 0;
  const bins = (byPl ? hoKeys : plKeys).map(label => ({label, runs: numbered.filter(r => binOf(r) === label)}));
  // An HO past the table's PL人数 can't happen (HO4 at a 3PL table): it is left out of the chart, and the
  // other columns keep their width and move to the middle. (One that does have runs is a mistake in the data, so it stays visible.)
  const plN = k => /^(\d)PL$/.test(k) ? Number(k[0]) : Infinity, hoN = k => /^HO(\d+)$/.test(k) ? Number(k.slice(2)) : Infinity;
  for (const b of bins) b.void = !b.runs.length && (byPl ? hoN(b.label) > plN(tabKey) : hoN(tabKey) > plN(b.label));
  // Each bar has a colour of its own, the same in every tab: HO1〜HO6〜 the categorical slots in order,
  // PL人数 one blue stepping darker (lighter in dark mode) with more players, 不明 grey.
  const colorOf = label => /^HO(\d+)/.test(label) ? `var(--ho${Math.min(Number(label.match(/\d+/)[0]), HO_MAX + 1)})` : /^(\d)PL/.test(label) ? `var(--pl${label[0]})` : "var(--plx)";
  const shown = bins.filter(b => !b.void);
  const max = Math.max(1, ...bins.map(b => b.runs.length));
  // The scale always goes past the tallest bar (at least 15% and one grid step), so its number stays inside the chart.
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10, top = Math.max(Math.ceil(max * 1.15 / step), Math.floor(max / step) + 1) * step;
  const pct = n => total ? Math.round(n / total * 100) : 0;
  const isNamed = tabKey === NAMED;
  // A row reads "❌ 名前 HO名": ❌ for a lost character, and the HO without its number (the bar already
  // says it): "HO1" and "HO1兼HO2" show nothing, "HO1英国テーラー" shows 英国テーラー. The 番号なし list keeps the whole HO.
  const lostMark = c => isLost(c) ? `<span class="lostx" role="img" aria-label="ロスト${c.system ? `（${esc(sysShort(c.system))}）` : ""}" title="ロスト${c.system ? `（${esc(sysShort(c.system))}）` : ""}">❌</span>` : "";
  const hoName = role => isNamed ? role : String(role).normalize("NFKC").slice(hoLead(role).len).replace(/^[\s:：・\-－]+/, "");
  const runLi = r => { const h = hoName(r.role); return `<li${isLost(r.c) ? ` class="is-lost"` : ""}><span class="t">${esc(r.name)}</span><span class="who">${lostMark(r.c)}<a href="#/${encodeURIComponent(r.p.key)}" title="${esc(r.role)}">${esc(r.p.name)}</a>${h ? `<span class="role">${esc(h)}</span>` : ""}${isNamed ? `<span class="plk">${esc(plOf(r))}</span>` : ""}</span></li>`; };
  $("root").innerHTML = `
  <header class="hero wrap">
    <p class="eyebrow">HO Tendency</p>
    <h1 class="sub">HOの傾向</h1>
    <div class="rule" aria-hidden="true"><i></i></div>
  </header>
  <main class="wrap ho"><section class="hopage">
    <aside class="honote" aria-label="このグラフについて">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="6" r="1.1" fill="currentColor"/><path d="M10 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <details data-honote${HO_S.noteOpen ? " open" : ""}>
        <summary>どのHOでシナリオを遊んだか数えたグラフです。<span class="more">くわしく</span></summary>
        <ul>
          <li>同じキャラが同じシナリオを複数のシートに持っているときは1回で数えます。</li>
          <li>キャンペーンで話数ごとに分かれたシナリオも1シリーズとして扱います。</li>
          <li>「HO1兼HO2」のような兼任は、HO1とHO2の両方に1件ずつ数えます（このためグラフの数と表の数が合わない場合があります）。</li>
          <li>番号のないHOは、グラフに入れず「番号なし」のタブに一覧で出します。</li>
        </ul>
      </details>
    </aside>
    <div class="ho-chips" role="group" aria-label="システムで絞り込む">
      <button type="button" data-hsys="" aria-pressed="${!HO_S.sys}">すべて</button>
      ${systems.map(s => `<button type="button" data-hsys="${esc(s)}" aria-pressed="${HO_S.sys===s}">${esc(sysJa(s))}</button>`).join("")}
    </div>
    <div class="hoaxis" role="group" aria-label="見かた">
      <button type="button" data-haxis="pl" aria-pressed="${byPl}">PL人数で見る</button><button type="button" data-haxis="ho" aria-pressed="${!byPl}">HOで見る</button>
    </div>
    <div class="hotabs" role="tablist" aria-label="${byPl ? "PL人数" : "HO"}">
      ${tabs.map(t => `<button type="button" role="tab" data-htab="${t.k}" aria-selected="${tabKey===t.k}">${t.k}<small>${t.n}</small></button>`).join("")}
    </div>
    ${isNamed ? `<div class="hocard" role="tabpanel">
      <h2>番号のないHO</h2>
      <p class="sub">通過 <b>${allNamed.length}</b>件${HO_S.sys ? `（${esc(sysJa(HO_S.sys))}）` : ""}・グラフには入れていません</p>
      <ul class="horuns">${[...allNamed].sort((a, b) => a.role.localeCompare(b.role, "ja") || a.name.localeCompare(b.name, "ja")).map(runLi).join("")}</ul>
    </div>` : `
    <div class="hocard" role="tabpanel">
      <h2>${byPl ? `${esc(tabKey)}の卓のHO` : `${esc(tabKey)}を担当した卓のPL人数`}</h2>
      <p class="sub">HO番号のある通過 <b>${total}</b>件${HO_S.sys ? `（${esc(sysJa(HO_S.sys))}）` : ""}${shared ? "・兼任は両方に数えています" : ""}</p>
      ${total ? `<div class="hochart" style="--n:${bins.length};--m:${shown.length}">
        <div class="plot" role="group" aria-label="${byPl ? `${esc(tabKey)}の卓のHO番号ごとの通過数` : `${esc(tabKey)}のPL人数ごとの通過数`}">
          ${[...Array(top / step + 1).keys()].map(i => `<div class="gl" style="bottom:${i*step/top*100}%"><span>${i*step}</span></div>`).join("")}
          ${shown.map(b => b.runs.length
            ? `<button type="button" class="col" data-ho="${b.label}" style="--h:${b.runs.length/top*100}%;--c:${colorOf(b.label)}" aria-label="${b.label}：${b.runs.length}件（${pct(b.runs.length)}%）。押すと内訳を開く"><i></i><span class="v">${b.runs.length}</span></button>`
            : b.void ? `<div class="col zero" aria-hidden="true"></div>`
            : `<div class="col zero" style="--h:0%" aria-label="${b.label}：0件"><i></i><span class="v">0</span></div>`).join("")}
        </div>
        <div class="xs">${shown.map(b => `<span>${b.label}</span>`).join("")}</div>
      </div>` : `<p class="none">${byPl ? "この人数の卓でHO番号のある通過はありません。" : "このHOの通過はありません。"}</p>`}
    </div>
    ${total ? `<div class="hoacc">${bins.map(b => b.runs.length
      ? `<details class="hoitem" data-hoitem="${b.label}"><summary><span class="k"><i class="sw" style="--c:${colorOf(b.label)}" aria-hidden="true"></i>${b.label}</span><span class="n">${b.runs.length}件<span class="pc">・${pct(b.runs.length)}%</span></span><span class="chev" aria-hidden="true"></span></summary>
          <div class="hobody"><ul class="horuns">${b.runs.map(runLi).join("")}</ul></div></details>`
      : "").join("")}</div>` : ""}
    `}
  </section>
  <a class="back" href="#">← キャラクター一覧へ</a>
  </main>
  ${FOOT}`;
  document.title = "HOの傾向 | シザキカノトのTRPGキャラクター一覧";
  const chart = $("root").querySelector(".hochart");
  if (!chart) return;
  let tip = null;
  const show = col => {
    const b = bins.find(x => x.label === col.dataset.ho);
    if (!tip){ tip = document.createElement("div"); tip.className = "hotip"; chart.append(tip); }
    tip.innerHTML = `${esc(tabKey)}・${b.label}　<b>${b.runs.length}</b>件（${pct(b.runs.length)}%）`;
    const r = col.getBoundingClientRect(), c = chart.getBoundingClientRect(), bar = col.querySelector("i").getBoundingClientRect();
    tip.style.left = `${r.left - c.left + r.width/2}px`; tip.style.top = `${bar.top - c.top - 26}px`;
  };
  const hide = () => { tip?.remove(); tip = null; };
  for (const col of chart.querySelectorAll(".col[data-ho]")){   // 0件 bars have no tooltip
    col.addEventListener("pointerenter", () => show(col)); col.addEventListener("pointerleave", hide);
    col.addEventListener("focus", () => show(col)); col.addEventListener("blur", hide);
  }
}

const FOOT = `<footer class="foot"><img class="crowla l" src="crowla-light.png" alt="隠れ家クロウラ CLAWLER THE HIDEOUT." width="761" height="158"><img class="crowla d" src="crowla-dark.png" alt="" width="761" height="158">© Shizaki Kanoto / 隠れ家クロウラ</footer>`;
let lastIndexY = 0;
function route(){
  if (!S.chars.length) return;
  const m = location.hash.match(/^#\/(.+)$/);
  if (location.hash === "#ho"){ renderHo(); window.scrollTo(0, 0); return; }
  const p = m && S.people.find(x => x.key === decodeURIComponent(m[1]));
  // Opening a profile starts again from the list's system; the sheet buttons then change it.
  if (p){ delete S.sheet[p.key]; renderProfile(p); window.scrollTo(0, 0); }
  else { renderIndex(); window.scrollTo(0, lastIndexY); }
}
window.addEventListener("hashchange", () => route());
document.addEventListener("click", e => {
  const tl = e.target.closest("[data-tl]");
  if (tl){ const d = $("tl"); if (d) tl.dataset.tl === "open" ? d.showModal() : d.close(); return; }
  if (e.target.matches("dialog.tl")){ e.target.close(); return; }   // a click on the backdrop
  const hs = e.target.closest("[data-hsys]");
  if (hs){ HO_S.sys = hs.dataset.hsys; renderHo(); return; }
  const ha = e.target.closest("[data-haxis]");
  if (ha){ HO_S.axis = ha.dataset.haxis; renderHo(); $("root").querySelector(`[data-haxis="${HO_S.axis}"]`)?.focus(); return; }
  const ht = e.target.closest("[data-htab]");
  if (ht){ HO_S[HO_S.axis === "ho" ? "hoTab" : "pl"] = ht.dataset.htab; renderHo(); $("root").querySelector(`[data-htab="${ht.dataset.htab}"]`)?.focus(); return; }
  const ho = e.target.closest("[data-ho]");
  if (ho){ const d = $("root").querySelector(`[data-hoitem="${ho.dataset.ho}"]`); if (d){ d.open = true; d.scrollIntoView({behavior: smooth(), block: "nearest"}); } return; }
  const t = e.target.closest("[data-sys]");
  if (t){ S.sys = t.dataset.sys; store.set("gSys", S.sys); renderIndex(); return; }
  const sh = e.target.closest("[data-sheet]");
  if (sh){ const m = location.hash.match(/^#\/(.+)$/); const p = m && S.people.find(x => x.key === decodeURIComponent(m[1]));
    if (p){ S.sheet[p.key] = sh.dataset.sheet; renderProfile(p); } return; }
  if (e.target.closest(".tile")) lastIndexY = window.scrollY;
});
document.addEventListener("change", e => {
  if (e.target.id === "lostsw"){ S.lost = e.target.checked; store.set("gLost", S.lost ? "1" : "0"); renderIndex(); }
});

/* data.json, read again when the sheet book (index.html) updates it or this tab comes back into view,
   so a gallery left open shows the latest sheets. */
let generatedAt = null;
async function load(again){
  let data;
  try {
    const r = await fetch("data.json", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch {
    if (!again) $("root").innerHTML = `<p class="empty">キャラクターを読み込めませんでした。</p>`;
    return;
  }
  if (again && data.generatedAt === generatedAt) return;
  generatedAt = data.generatedAt;
  S.chars = data.chars || [];
  buildPeople();
  if (S.sys && !S.people.some(p => p.systems.includes(S.sys))) S.sys = "";
  if (!again) return route();
  // Keep the place: redraw the page that is open without scrolling.
  const m = location.hash.match(/^#\/(.+)$/);
  const p = m && S.people.find(x => x.key === decodeURIComponent(m[1]));
  const y = window.scrollY;
  if (location.hash === "#ho") renderHo(); else if (p) renderProfile(p); else renderIndex();
  window.scrollTo(0, y);
}
try { new BroadcastChannel("charsheet-data").onmessage = () => load(true); } catch {}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(true); });
load(false);

/* ---------- back to the top ----------
   The button shows once the page is scrolled past the first screen. At the very bottom, pulling
   further (a touch drag upward, or more wheel / trackpad scrolling after a pause) fills the ring;
   when it is full, letting go (touch) or the next scroll (wheel) goes back to the top. */
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
function toTop(){ window.scrollTo({top:0, behavior:smooth()}); }
const topBtn = $("totop"), pull = $("pull");
topBtn.addEventListener("click", toTop);
function syncTopBtn(){
  const on = window.scrollY > Math.max(400, innerHeight * 0.8);
  topBtn.classList.toggle("on", on); topBtn.tabIndex = on ? 0 : -1;
}
addEventListener("scroll", syncTopBtn, {passive:true});
addEventListener("hashchange", () => setTimeout(syncTopBtn, 0));
syncTopBtn();

// A little slack: phone toolbars change innerHeight while scrolling.
const atBottom = () => innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8;
const PULL_TOUCH = 60, PULL_WHEEL = 180;   // px of pull needed
function showPull(p){
  p = Math.max(0, Math.min(1, p));
  pull.classList.toggle("on", p > 0);
  pull.classList.toggle("ready", p >= 1);
  pull.querySelector(".ring").style.setProperty("--p", p);
  pull.style.setProperty("--y", `${Math.round((1 - p) * 10)}px`);
  pull.querySelector(".txt").textContent = p >= 1 ? "離すと先頭へ" : "引っぱって先頭へ";
}
function hidePull(){ pull.classList.remove("on", "ready"); pull.style.setProperty("--y", "40px"); }
// Touch: a drag upward once the page is at the bottom (it may reach the bottom during the drag).
let touchY = null, touchP = 0, touching = false;
addEventListener("touchstart", e => { touching = e.touches.length === 1; touchY = touching && atBottom() && window.scrollY > 0 ? e.touches[0].clientY : null; touchP = 0; }, {passive:true});
addEventListener("touchmove", e => {
  if (!touching) return;
  const y = e.touches[0].clientY;
  if (!atBottom() || window.scrollY <= 0){ touchY = null; touchP = 0; hidePull(); return; }
  if (touchY == null) touchY = y;          // reached the bottom while dragging: count from here
  touchP = (touchY - y) / PULL_TOUCH;
  if (touchP < 0){ touchY = y; touchP = 0; }
  showPull(touchP);
}, {passive:true});
addEventListener("touchend", () => { if (touchY != null && touchP >= 1) toTop(); touching = false; touchY = null; touchP = 0; hidePull(); }, {passive:true});
addEventListener("touchcancel", () => { touching = false; touchY = null; hidePull(); }, {passive:true});
// Wheel / trackpad: only a new gesture started at the bottom counts, so the scroll that just
// reached the bottom (with its momentum) does not jump back up by itself.
let wheelSum = 0, wheelAt = 0, wheelArmed = false, wheelHide = 0;
addEventListener("wheel", e => {
  const now = Date.now(), fresh = now - wheelAt > 150;
  wheelAt = now;
  if (e.deltaY <= 0 || !atBottom() || window.scrollY <= 0){ wheelSum = 0; wheelArmed = false; hidePull(); return; }
  if (fresh) wheelArmed = true;
  if (!wheelArmed) return;
  wheelSum += e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
  showPull(wheelSum / PULL_WHEEL);
  clearTimeout(wheelHide);
  if (wheelSum >= PULL_WHEEL){ wheelSum = 0; wheelArmed = false; setTimeout(() => { hidePull(); toTop(); }, 180); return; }
  wheelHide = setTimeout(() => { wheelSum = 0; hidePull(); }, 700);
}, {passive:true});
</script>
